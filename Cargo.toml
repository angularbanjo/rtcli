[package]
name = "rtcli"
version = "0.1.1"
edition = "2024"
repository = "https://github.com/angularbanjo/rtcli"
license = "Apache-2.0"
description = "Modern, portable rtorrent CLI"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = "7"
thiserror = "2"
toml = "0.8"
dirs = "5"
base64 = "0.22"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
